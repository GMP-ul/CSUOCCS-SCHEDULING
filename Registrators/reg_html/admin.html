<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler-Dashboard</title>
    <link rel="stylesheet" href="/Registrators/reg_css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet" />


</head>
<body>
    <nav class="side-bar" style="grid-area: box-1;">
        <div class="nav-top">
            <div class="nav-logo">
                <div class="background-logo"></div>
                <img src="/Logo/logo.png" alt="">
            </div>
            <div class="nav-title">
                <h1>CSU OCCS SCHEDULER</h1>
                <p>Admin console</p>
            </div>
        </div>

        <div class="nav-middle">
            <div class="nav-middle-btn">
                <button class="btn" id="mainBtn" onclick="setActive(this)"><i class="ri-dashboard-line"></i>Dashboard</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-calendar-event-line"></i>Appointments</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-barcode-fill"></i>Referral Code</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-group-line"></i>Applicats</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-bar-chart-grouped-fill"></i>Reports</button>
            </div>
        </div>

        <div class="nav-bottom">
            <div class="nav-bottom-btn">
                <button class="btn" onclick="setActive(this)"><i class="ri-question-line"></i>Help & Support</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-settings-line"></i>Settings</button>
                <button class="btn" onclick="setActive(this)"><i class="ri-logout-box-r-line"></i>Log out</button>
            </div>
        </div>

        <div class="nav-bottom-2">
                <div class="nav-logo-bottom">
                    <div class="background-logo"></div>
                    <img src="/Logo/logo.png" alt="">
                </div>
                <div class="nav-title-bottom">
                    <h1>CSU OCCS SCHEDULER</h1>
                    <p>Admin console</p>
                </div>
            </div>
        </div>
    </nav>

    <nav class="top-bar" style="grid-area: box-2;">
        <div class="title">
            <div class="section-name">
                <h1>Dashboard</h1>
            </div>
            <div class="date">
                <p>Friday, September 4,2026</p>
            </div>
        </div>
        <div class="other-function">
            <div class="search-bar">
                <i class="ri-search-line search-icon"></i>
                <input type="text" placeholder="Search Applicats, ref. no..." class="inside-search">
            </div>
            <div class="noti">
                <i class="ri-notification-2-line"></i>
            </div>
            <div class="profile">
                <h1>J</h1>
            </div>
        </div>
    </nav>

    <main style="grid-area: box-3;">
        <div class="area-main-1" style="grid-area: box-2-1;"></div>
        <div class="" style="grid-area: box-2-2;"></div>
        <div class="" style="grid-area: box-2-3;"></div>
        <div class="" style="grid-area: box-2-4;"></div>
        <div class="" style="grid-area: box-2-5;"></div>
        <div class="" style="grid-area: box-2-6;"></div>
        <div class="" style="grid-area: box-2-7;"></div>
        <div class="" style="grid-area: box-2-8;"></div>
    </main>

    <script src="/Registrators/reg_js/admin.js"></script>
</body>
</html>
