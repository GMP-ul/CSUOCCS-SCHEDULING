<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSU Online Testing Scheduler</title>

    <link rel="icon" type="image/pgn" href="IMG/image-removebg-preview.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" href="CSS/index.css">
    <script src="JS/index.js" defer></script>
</head>
<body>
    <nav>

        <div class="logo">
            <img src="IMG/image-removebg-preview.png" alt="">
            <p>CSU OCC<br>SCHEDULER</p>
        </div>

        <div class="nav-btn" id="nav-btn">

            <div class="nav-open-close-btn">
                <button class="nav-menu-btn">
                    <span class="material-symbols-outlined">
                        menu
                    </span>
                </button>
            </div>
            <div class="nav-btn-area">
                <div class="nav-btn-area-top">
                    <div class="nav-btn-area-logo">
                        <img src="IMG/image-removebg-preview.png" alt="">
                        <p>CSU OCC<br>SCHEDULER</p>
                    </div>
                    <button class="nav-close-btn">
                        <span class="material-symbols-outlined">
                            close
                        </span>
                    </button>
                </div>
                <div class="nav-btn-desktop">
                    <button class="nav-signup-btn" id="menuAa">
                        Sign-up
                    </button>
                    <button class="nav-login-btn" id="menuBb">
                        log-in
                    </button>
                </div>
                <div class="nav-btn-phone">
                    <button>
                        log-in
                    </button>
                    <button>
                        sign-up
                    </button>
                    <button>
                        Learn More
                    </button>
                    <button>
                        Schedule Now
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="folder"></div>
        <div class="hero-background-place">
            <div class="shape"></div>
            <div class="gray"></div>
            <div class="hero-background">
                <img src="IMG/backgroundbuilding.jpg" alt="">
            </div>
        </div>
    </section>
</body>
</html>
